function tex(name, rx = 1, ry = 1, srgb = true) {
  const t = loader.load(TEX[name]);

// ---------- the floor: irregular, chipped stone slabs ----------
const sideMat = stone('tex_slab_d', 1, 0.3);
const topMats = ['tex_top0', 'tex_top1', 'tex_top2', 'tex_top3'].map(n => stone(n));
function roughSlab(w, h, d) {
  const g = new THREE.BoxGeometry(w, h, d, 7, 2, 7);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if (y > 0) {
      const ex = Math.abs(x) / (w / 2), ez = Math.abs(z) / (d / 2), edge = Math.max(ex, ez);
      x *= 1 - 0.025 * Math.pow(edge, 10); z *= 1 - 0.025 * Math.pow(edge, 10);        // worn, rounded top edges
      y -= 0.012 * Math.pow(edge, 12) + (edge > 0.93 ? Math.abs(rs(0.014)) : Math.abs(rs(0.003)));   // chipped rim, near-flat face
      y += 0.003 * Math.sin(x * 9 + z * 7) * (1 - edge);
    }
    p.setXYZ(i, x + rs(0.002), y, z + rs(0.002));
  }
  g.computeVertexNormals();
  return g;
}
const slabs = [];
for (let r = 0; r < 8; r++) {
  const cz = -1.05 + r * 0.625;
  if (cz > 3.35) break;
  let x = -3.3 + rs(0.15);
  while (x < 3.3) {
    const w = 0.42 + rnd() * 0.36, d = 0.56 + rnd() * 0.06, h = 0.14 + rnd() * 0.05;
    const mats = [sideMat, sideMat, topMats[Math.floor(rnd() * 4)], sideMat, sideMat, sideMat];
    const m = new THREE.Mesh(roughSlab(w, h, d), mats);
    const s = { mesh: m, x: x + w / 2, z: cz + rs(0.02), w, d, h, y: h / 2, vy: 0, rx: rs(0.012), rz: rs(0.012), ry: rs(0.035),
                trx: 0, trz: 0, ty: h / 2, phase: 'rest', t0: 0 };
    s.trx = s.rx; s.trz = s.rz;
    m.position.set(s.x, s.y, s.z); m.rotation.set(s.rx, s.ry, s.rz);
    m.castShadow = m.receiveShadow = true;
    scene.add(m); slabs.push(s);
    x += w + 0.02 + rnd() * 0.025;
  }
}
const pit = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), new THREE.MeshStandardMaterial({ color: 0x15110d, roughness: 1 }));
pit.rotation.x = -Math.PI / 2; pit.position.set(0, -0.1, 1.4); pit.receiveShadow = true; scene.add(pit);
function slabAt(x, z) { return slabs.find(s => Math.abs(x - s.x) <= s.w / 2 && Math.abs(z - s.z) <= s.d / 2); }
function topY(s, x, z) { return s.y + s.h / 2 + (z - s.z) * Math.tan(s.rx) - (x - s.x) * Math.tan(s.rz); }

// ---------- the wall: individual stones in courses, a real doorway ----------
const wallMats = [];

  const m = stone(n, 0.35 + rnd() * 0.25, 0.35 + rnd() * 0.25); m.map.offset.set(rnd(), rnd()); m.map.rotation = rs(0.4); wallMats.push(m);
}
function block(x0, x1, y0, y1, zf) {
  const w = x1 - x0 - 0.025, h = y1 - y0 - 0.025, dpt = 0.28 + rnd() * 0.12;
  const m = new THREE.Mesh(roughSlab(w, dpt, h), wallMats[Math.floor(rnd() * wallMats.length)]);
  m.rotation.x = -Math.PI / 2; m.rotation.z = rs(0.02);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, zf + dpt / 2 - rnd() * 0.04);

}

    const bw = 0.42 + rnd() * 0.45;
    const x1 = x + bw;
    const inDoorX = x1 > DOOR.x0 - 0.02 && x < DOOR.x1 + 0.02, inDoorY = y < DOOR.y1;
    if (!(inDoorX && inDoorY)) {
      if (inDoorX && !inDoorY && y < DOOR.y1 + 0.5) block(Math.min(x, DOOR.x0 - 0.12), Math.max(x1, DOOR.x1 + 0.12), y, y + bh, DOOR.z - 0.04);  // lintel
      else block(x, x1, y, y + bh, DOOR.z);
    } else {
      if (x < DOOR.x0) block(x, DOOR.x0, y, y + bh, DOOR.z);
      if (x1 > DOOR.x1) block(DOOR.x1, x1, y, y + bh, DOOR.z);
    }
    x = x1;
  }
  y += bh;
}

const door = { a: 0.07, v: 0, target: 0.07 };

const shaftGeo = new THREE.BufferGeometry();
const shaftMat = new THREE.MeshBasicMaterial({ color: 0xffe0b0, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
  depthWrite: false, side: THREE.DoubleSide, fog: false });
scene.add(new THREE.Mesh(shaftGeo, shaftMat));
function updateShaft(open) {
  const fx = DOOR.x1 - (DOOR.x1 - DOOR.x0) * Math.sin(open * Math.PI / 2 * 0.98);
  const top = [[DOOR.x0, DOOR.y1, DOOR.z], [fx, DOOR.y1, DOOR.z], [fx, 0.17, DOOR.z], [DOOR.x0, 0.17, DOOR.z]];
  const L = sun.position, floor = top.map(p => { const t = (L.y - 0.17) / (L.y - p[1] + 1e-6); return [L.x + t * (p[0] - L.x), 0.17, L.z + t * (p[2] - L.z)]; });
  const v = [], quad = (a, b, c, d) => v.push(...a, ...b, ...c, ...a, ...c, ...d);
  quad(top[0], top[1], floor[1], floor[0]); quad(top[3], top[2], floor[2], floor[3]);
  quad(top[0], top[3], floor[3], floor[0]); quad(top[1], top[2], floor[2], floor[1]);
  shaftGeo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
}

// ---------- the iron: the cuff from the approved artwork, and a chain ----------
const cuffSlab = slabAt(0.12, 0.2) || slabs[Math.floor(slabs.length / 2)];
const CW = 0.26, CH = CW * 310 / 380, SPLIT = 0.52;
function cuffHalf(off, rep, centerX) {
  const t = tex('cuff_sprite'); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; t.repeat.set(rep, 1); t.offset.set(off, 0);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, fog: true }));
  s.center.set(centerX, 0.1); s.scale.set(CW * rep, CH, 1); scene.add(s); return s;
}
const cuffL = cuffHalf(0, SPLIT, 1), cuffR = cuffHalf(SPLIT, 1 - SPLIT, 0);
const cuffShadow = new THREE.Mesh(new THREE.CircleGeometry(0.15, 24), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.55, depthWrite: false }));
cuffShadow.rotation.x = -Math.PI / 2; cuffShadow.scale.set(1, 0.45, 1); scene.add(cuffShadow);
const cuffState = { open: 0, target: 0 };
const cuffPos = new THREE.Vector3();

const ironMat = new THREE.MeshStandardMaterial({ map: tex('tex_iron', 2, 1), roughness: 0.82, metalness: 0.35, color: 0x6e5c4e,
  bumpMap: bump, bumpScale: 1.2 });
const linkGeo = new THREE.TorusGeometry(0.026, 0.0085, 7, 14);
const NL = 34, anchor = new THREE.Vector3(-1.9, 0.0, 0.85), links = [];
for (let i = 0; i < NL; i++) { const m = new THREE.Mesh(linkGeo, ironMat); m.castShadow = true; scene.add(m); links.push({ mesh: m, wob: rs(0.4) }); }
let released = 0;
function layChain() {
  const cx = cuffPos.x - CW * 0.35, cz = cuffPos.z;
  for (let i = 0; i < NL; i++) {
    const u = i / (NL - 1);
    let x = anchor.x + (cx - anchor.x) * u, z = anchor.z + (cz - anchor.z) * u + Math.sin(u * Math.PI) * 0.18;
    z -= released * 0.12 * Math.pow(u, 3);
    const s = slabAt(x, z);
    const y = s ? topY(s, x, z) + 0.006 : 0.14;
    const L = links[i].mesh;
    L.position.set(x, y, z);
    L.rotation.set(i % 2 ? Math.PI / 2 : 0.15 + links[i].wob * 0.2, -Math.atan2(cz - anchor.z, cx - anchor.x) + links[i].wob, 0);
  }
}

// ---------- dust ----------
const MAXD = 1600, dpos = new Float32Array(MAXD * 3), dvel = new Float32Array(MAXD * 3), dlife = new Float32Array(MAXD);
const dGeo = new THREE.BufferGeometry(); dGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
scene.add(new THREE.Points(dGeo, new THREE.PointsMaterial({ color: 0xffe7c2, size: 0.0065, transparent: true, opacity: 0.6,
  blending: THREE.AdditiveBlending, depthWrite: false })));
let dn = 0;
function emit(x, y, z, n, up) {
  for (let k = 0; k < n; k++) {
    const i = dn++ % MAXD;
    dpos.set([x + rs(0.15), y, z + rs(0.15)], i * 3);
    dvel.set([rs(0.25), Math.random() * up, rs(0.25)], i * 3);
    dlife[i] = 1.5 + Math.random() * 2.5;
  }
}
for (let k = 0; k < 220; k++) {
  const i = dn++; dpos.set([rs(0.7), 0.2 + Math.random() * 2.0, 0.6 + Math.random() * 2.9], i * 3);
  dvel.set([rs(0.01), rs(0.005), rs(0.01)], i * 3); dlife[i] = 1e9;
}

// ---------- the print finish: the cover's grain, paper and ink tone over everything ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.6, 0.88);
composer.addPass(bloom);
const paperTex = tex('paper', 1, 1, false);
const printPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, paper: { value: paperTex }, time: { value: 0 }, res: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform sampler2D paper; uniform float time; uniform vec2 res; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 ca = (vUv - 0.5) * 0.0018;
      vec3 c = vec3(texture2D(tDiffuse, vUv + ca).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - ca).b);
      float l = dot(c, vec3(0.299, 0.587, 0.114));
      vec3 ink = mix(vec3(0.09, 0.075, 0.06), vec3(0.97, 0.91, 0.80), smoothstep(0.02, 0.95, l));
      c = mix(c, ink, 0.30);                                   // pull toward the cover's warm duotone
      c = mix(c, c * vec3(1.05, 0.98, 0.88), 0.6);             // warm print stock
      float p = texture2D(paper, vUv * vec2(res.x / res.y, 1.0) * 1.6).r;
      c *= 0.90 + 0.20 * p;                                    // paper fibre and halftone from the cover
      float g = h(floor(vUv * res) + floor(time * 24.0)) - 0.5;
      c += g * 0.035 * (0.35 + 0.65 * (1.0 - l));               // film grain, heavier in shadow
      vec2 d = vUv - 0.5; c *= 1.0 - dot(d, d) * 0.75;        // lens falloff
      c = max(c, vec3(0.035, 0.03, 0.025));                    // ink never goes digital black
      gl_FragColor = vec4(c, 1.0);
    }`
});
composer.addPass(printPass);
composer.addPass(new OutputPass());

// ---------- story ----------
const hint = document.getElementById('hint'), end = document.getElementById('end');
let stage = 0, t = 0, shake = 0;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function say(s) { hint.style.opacity = 0; setTimeout(() => { hint.textContent = s; hint.style.opacity = s ? 0.9 : 0; }, 500); }
function quake() {
  if (stage !== 0) return;
  advance.textContent = 'Open the chain';
  stage = 1; shake = reducedMotion ? 0 : 1; door.target = 0.62; door.v += 2.4;
  for (const s of slabs) s.t0 = t + Math.hypot(s.x, DOOR.z - s.z) / 3.6;
  say(''); setTimeout(() => say('FIND THE IRON'), 3200);
}
function openCuff() {
  if (stage !== 1) return;
  advance.textContent = 'Walk to the light';
  stage = 2; cuffState.target = 1; door.target = 1.0; door.v += 1.6;
  emit(cuffPos.x, cuffPos.y, cuffPos.z, 60, 1.0);
  say(''); setTimeout(() => say('THE DOOR IS OPEN'), 2400);
}

// ---------- input ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let drag = null, moved = 0;
const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => {
  if (!e.isPrimary || e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
  moved = 0;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (drag?.id !== e.pointerId) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy);
  view.yaw -= dx * 0.004;
  if (e.pointerType !== 'touch' || innerWidth > 650) view.pitch = Math.max(-0.9, Math.min(0.6, view.pitch - dy * 0.004));
  drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
});
canvas.addEventListener('lostpointercapture', () => { drag = null; });
canvas.addEventListener('pointerup', e => {
  if (drag?.id !== e.pointerId) return;
  drag = null;
  if (moved > 6) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects([cuffL, cuffR, ...links.map(l => l.mesh)], false);
  if (hit.length && stage === 1) return openCuff();
  if (stage === 0) quake();
});
const advance = document.getElementById('advance');
advance.disabled = false;
advance.addEventListener('click', () => {
  if (stage === 0) quake();
  else if (stage === 1) openCuff();
  else view.z = 3.05;
});
end.querySelector('a[target="_top"]').addEventListener('click', e => {
  if (parent === window) return;
  e.preventDefault();
  parent.postMessage('floor-room:acts', location.origin);
});
const keys = {};
addEventListener('keydown', e => {
  if (e.target.closest('button,a')) return;
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') { e.preventDefault(); quake(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('wheel', e => { view.walk = (view.walk || 0) - e.deltaY * 0.0015; }, { passive: true });
document.getElementById('again').onclick = () => { end.classList.remove('on'); end.inert = true; advance.focus(); view.z = 1.2; say('STAY'); };
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  printPass.uniforms.res.value.set(innerWidth, innerHeight);
});

// ---------- loop ----------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.033, clock.getDelta()); t += dt;
  for (const s of slabs) {
    if (s.phase === 'rest' && stage >= 1 && t >= s.t0) {
      s.phase = 'air'; s.vy = 0.9 + Math.random() * 0.6; s.vrx = rs(0.7); s.vrz = rs(0.7);
      s.trx = rs(0.08); s.trz = rs(0.08); s.ty = s.h / 2 - Math.random() * 0.05;
      emit(s.x, 0.1, s.z - s.d / 2, 6, 0.5);
    }
    if (s.phase === 'air') {
      s.vy -= 9.81 * dt; s.y += s.vy * dt; s.rx += s.vrx * dt; s.rz += s.vrz * dt;
      if (s.y <= s.ty && s.vy < 0) { s.y = s.ty; s.vy *= -0.22; s.vrx *= -0.3; s.vrz *= -0.3;
        if (Math.abs(s.vy) < 0.25) s.phase = 'settle'; emit(s.x, s.ty + s.h / 2, s.z, 10, 0.9); }
    } else if (s.phase === 'settle') {
      const k = Math.min(1, dt * 10);
      s.rx += (s.trx - s.rx) * k; s.rz += (s.trz - s.rz) * k; s.y += (s.ty - s.y) * k;
    }
    s.mesh.position.set(s.x, s.y, s.z); s.mesh.rotation.set(s.rx, s.ry, s.rz);
  }
  // cuff rides its slab; its left half swings up off the split on release
  cuffState.open += (cuffState.target - cuffState.open) * Math.min(1, dt * 7);
  const hx = cuffSlab.x + 0.04;
  cuffPos.set(hx, topY(cuffSlab, hx, cuffSlab.z) - 0.005, cuffSlab.z);
  const hinge = new THREE.Vector3(cuffPos.x - CW / 2 + CW * SPLIT, cuffPos.y, cuffPos.z);
  cuffL.position.copy(hinge); cuffR.position.copy(hinge);
  cuffL.material.rotation = cuffState.open * 0.55 + (-cuffSlab.rz);
  cuffR.material.rotation = -cuffSlab.rz;
  cuffShadow.position.set(cuffPos.x, cuffPos.y + 0.003, cuffPos.z + 0.02);
  released += ((stage >= 2 ? 1 : 0) - released) * Math.min(1, dt * 1.5);
  layChain();
  // door spring and the light it lets in
  door.v += (55 * (door.target - door.a) - 6.5 * door.v) * dt; door.a = Math.max(0, Math.min(1, door.a + door.v * dt));
  leafPivot.rotation.y = -door.a * 1.75;
  const L = 0.2 + 0.8 * door.a;
  sun.intensity = 150 * L; bounce.intensity = 1.6 * door.a; crack.intensity = 2.2 * (1 - door.a) + 0.6;
  hemi.intensity = 0.55 + 0.2 * door.a;
  const lit = 0.35 + 0.75 * L; cuffL.material.color.setScalar(lit); cuffR.material.color.setScalar(lit);
  outsideMat.color.setScalar(0.25 + 0.95 * L);
  shaftMat.opacity = 0.03 * door.a; updateShaft(door.a);
  scene.fog.density = 0.075 - 0.03 * door.a;
  for (let i = 0; i < MAXD; i++) {
    if (dlife[i] <= 0) { dpos[i * 3 + 1] = -9; continue; }
    if (dlife[i] < 1e8) { dvel[i * 3 + 1] -= 2.6 * dt; dlife[i] -= dt; }
    for (let k = 0; k < 3; k++) { dvel[i * 3 + k] *= 0.985; dpos[i * 3 + k] += dvel[i * 3 + k] * dt; }
    if (dpos[i * 3 + 1] < 0.1 && dlife[i] < 1e8) dlife[i] = 0;
  }
  dGeo.attributes.position.needsUpdate = true;
  const f = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0) + (view.walk || 0);
  view.walk = (view.walk || 0) * 0.85;
  view.x += -Math.sin(view.yaw) * f * dt * 0.9; view.z += Math.cos(view.yaw) * f * dt * 0.9;
  view.x = Math.max(-2.6, Math.min(2.6, view.x)); view.z = Math.max(-1.6, Math.min(3.25, view.z));
  if (stage === 2 && view.z > 2.95 && !end.classList.contains('on')) {
    end.inert = false;
    end.classList.add('on');
    end.querySelector('a[target="_top"]').focus();
  }
  shake = Math.max(0, shake - dt * 0.9);
  // a held camera, never a perfect tripod
  const sway = new THREE.Vector3(Math.sin(t * 0.7) * 0.006 + Math.sin(t * 1.9) * 0.002, Math.sin(t * 0.9 + 1) * 0.004, 0);
  camera.position.set(view.x + (reducedMotion ? 0 : sway.x) + rs(0.012) * shake, view.y + (reducedMotion ? 0 : sway.y) + rs(0.012) * shake, view.z);
  const yaw = view.yaw + Math.sin(t * 0.5) * 0.004, pitch = view.pitch + Math.sin(t * 0.63 + 2) * 0.003;
  const dir = new THREE.Vector3(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  camera.lookAt(camera.position.clone().add(dir));
  printPass.uniforms.time.value = t;
  composer.render();
  requestAnimationFrame(frame);
}
frame();
window.__room = { quake, openCuff, view, state: () => ({ stage, door: door.a, cuff: cuffState.open, slabs: slabs.length }) };
</script>
</body>
</html>
